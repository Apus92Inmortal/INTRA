name: Authenticated Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_CLIENT_EMAIL: ${{ secrets.SMOKE_CLIENT_EMAIL }}
      SMOKE_CLIENT_PASSWORD: ${{ secrets.SMOKE_CLIENT_PASSWORD }}
      SMOKE_TRAVELER_EMAIL: ${{ secrets.SMOKE_TRAVELER_EMAIL }}
      SMOKE_TRAVELER_PASSWORD: ${{ secrets.SMOKE_TRAVELER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate smoke secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SMOKE_BASE_URL \
            SMOKE_CLIENT_EMAIL \
            SMOKE_CLIENT_PASSWORD \
            SMOKE_TRAVELER_EMAIL \
            SMOKE_TRAVELER_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required smoke secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated smoke
        run: npm run test:e2e:auth-smoke
